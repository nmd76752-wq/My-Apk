name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Missing Android Structure
        run: |
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          
          # ডাউনলোডের ফাইলগুলো ঠিক জায়গায় মুভ করা
          mkdir -p app/src/main
          if [ -d "src" ]; then mv src app/src/; fi
          if [ -f "AndroidManifest.xml" ]; then mv AndroidManifest.xml app/src/main/; fi
          if [ -d "res" ]; then mv res app/src/main/; fi
          
          # যদি আগে থেকেই app ফোল্ডার না থাকে, তবে একটি মিনিমাল স্ট্রাকচার তৈরি
          if [ ! -f "app/build.gradle.kts" ]; then
            mv build.gradle.kts app/
            # একটি রুট লেভেল সেটিংস ফাইল তৈরি যাতে শুধু app মডিউল থাকে
            echo "include(\":app\")" > settings.gradle.kts
          fi

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My_Quotex_App
          path: app/build/outputs/apk/debug/*.apk
          
